plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.nearby'
version = '0.1.0'

android {
  namespace "expo.modules.nearby"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Google Play services Nearby Connections (Bluetooth + Wi-Fi Direct between phones).
  implementation 'com.google.android.gms:play-services-nearby:19.3.0'
}
